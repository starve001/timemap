# MAPDEX 后端服务配置
server.port=8090
server.address=127.0.0.1

# gzip 压缩（与原 serve.js 行为对齐）
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/geo+json,image/svg+xml,text/plain

# 数据目录：默认取「启动目录」下的 data/ 与 events.json
# 如需自定义：java -Dmapdex.data-dir=D:/xxx/data -jar mapdex-server.jar
mapdex.data-dir=${user.dir}/data
mapdex.events-file=${user.dir}/events.json

spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %level %msg%n
logging.level.root=INFO
