# MAPDEX 后端服务配置
server.port=8090
server.address=127.0.0.1

# gzip 压缩（与原 serve.js 行为对齐）
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/geo+json,image/svg+xml,text/plain

# 数据目录：默认取「启动目录」下的 data/ 与 events.json
# 如需自定义：java -Dmapdex.data-dir=D:/xxx/data -jar mapdex-server.jar
mapdex.data-dir=${user.dir}/data
mapdex.events-file=${user.dir}/events.json

# AI 助手（LangChain4j + 智谱 GLM，OpenAI 兼容协议）
# API Key 优先从环境变量 ZHIPU_API_KEY 读取；也可直接在此填入 mapdex.ai.api-key=sk-xxx
# 前端「设置」面板写入的 Key/模型会持久化到 ai-config.json，重启后仍生效并覆盖此处默认值
mapdex.ai.api-key=${ZHIPU_API_KEY:}
mapdex.ai.base-url=https://open.bigmodel.cn/api/paas/v4
mapdex.ai.model=glm-4-flash
mapdex.ai.temperature=0.3
mapdex.ai.config-file=${user.dir}/ai-config.json

spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %level %msg%n
logging.level.root=INFO
